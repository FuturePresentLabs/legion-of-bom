# dev probes under examples/ construct one); it's zero cost unless a caller
# actually wraps a client with it.
ooda = { workspace = true, features = ["capture"] }
mlua.workspace = true
sqlx.workspace = true
tokio.workspace = true
gltf.workspace = true
gltf-json.workspace = true
